services:
  astra_api:
    container_name: astra_api
    build:
      context: ./astra_api
    env_file:
      - .env
    restart: always
    environment:
      SIDERIS_API_BASE: http://sideris:8624
    networks:
      - gateway-net
      - api-net
    depends_on:
      astra_api_db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 80 --workers 4

  astra_api_db:
    image: mongo:7.0
    container_name: astra_api_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - mongodb_init:/docker-entrypoint-initdb.d:ro
    networks:
      - api-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  astra_auth:
    container_name: astra_auth
    build:
      context: ./astra_auth
    env_file:
      - .env
    environment:
      DB_NAME: astra_auth
      DB_HOST: astra_api_db
      KEYS_DIR: keys
      UPLOADS_DIR: uploads
    restart: always
    volumes:
      - astra_auth_keys:/app/keys
      - astra_auth_uploads:/app/uploads
    networks:
      - gateway-net
      - api-net
    depends_on:
      astra_api_db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 80 --workers 4

  astra_ui:
    container_name: astra_ui
    restart: always
    build:
      context: ./astra_ui
      target: prod
    environment:
      VITE_API_URL: /api
      VITE_USER_DEBUG: ${USER_DEBUG:-false}
      PORT: 5173
    networks:
      - gateway-net
  
  sideris:
    container_name: sideris
    build:
      context: ./sideris
    restart: always
    networks:
      - api-net
      - gateway-net
    command: uvicorn sideris:app --host 0.0.0.0 --port 8624 --root-path /api/sideris --workers 4

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: always
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${LLM_DB_USER}:${LLM_DB_PASSWORD}@litellm_db:5432/${LLM_DB_NAME}"
      STORE_MODEL_IN_DB: True
    depends_on:
      litellm_db:
        condition: service_healthy
    command: [ "--config", "/app/config.yaml", "--port", "5000", "--num_workers", "8" ] 
    networks:
      - litellm-net
      - api-net

  litellm_db:
    image: postgres:16-alpine
    container_name: litellm_db
    restart: always
    environment:
      POSTGRES_DB: ${LLM_DB_NAME}
      POSTGRES_USER: ${LLM_DB_USER}
      POSTGRES_PASSWORD: ${LLM_DB_PASSWORD}
    volumes:
      - litellm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LLM_DB_USER} -d ${LLM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - litellm-net

  kong_gateway:
    container_name: kong_gateway
    image: kong:3.6
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 8 160k
      KONG_NGINX_PROXY_PROXY_BUSY_BUFFERS_SIZE: 160k
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0" # Cloudflare headers
      KONG_REAL_IP_HEADER: "X-Forwarded-For"
    volumes:
      - ./gateway/config.yml:/kong/kong.yml:ro
      - ./gateway:/var/log/kong/logs
    ports:
      - "80:8000"
      - "443:8443"
    depends_on:
      - astra_api
    networks:
      - gateway-net
  
networks:
  gateway-net:
    driver: bridge
  api-net:
    driver: bridge
  litellm-net:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_init:
  astra_auth_keys:
  astra_auth_uploads:
  litellm_data:
