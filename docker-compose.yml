services:
  astra_api:
    container_name: astra_api
    build:
      context: ./astra_api
      # target: dev
    restart: unless-stopped
    # ports:
    #   - "5245:80"
    volumes:
      - ./astra_api:/app
    networks:
      - gateway-net
    expose:
      - 80
    command: uvicorn main:app --reload --host 0.0.0.0 --port 80

  astra_ui:
    container_name: astra_ui
    build:
      context: ./astra_ui
      target: dev
    # ports:
    #   - "4000:5173"
    volumes:
      - ./astra_ui:/app
      - /app/node_modules
    networks:
      - gateway-net
    expose:
      - 5173
  
  # Ephemerides API Service
  sideris:
    container_name: sideris
    build:
      context: ./sideris
      # target: dev
    restart: unless-stopped
    # ports:
    #   - "8624:8624"
    volumes:
      - ./sideris:/app
    networks:
      - gateway-net
    expose:
      - 8624

    command: uvicorn sideris:app --reload --host 0.0.0.0 --port 8624 --root-path /api/sideris


  kong_gateway:
    container_name: kong_gateway
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

    volumes:
      - ./gateway/config.yml:/kong/kong.yml:ro
      - ./gateway:/var/log/kong/logs
    
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - astra_api
    
    networks:
      - gateway-net
  
networks:
  gateway-net:
    driver: bridge