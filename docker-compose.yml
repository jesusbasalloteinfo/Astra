services:
  astra_api:
    container_name: astra_api
    build:
      context: ./astra_api
      # target: dev
    env_file:
      - .env
    restart: unless-stopped
    # ports:
    #   - "5245:80"
    volumes:
      - ./astra_api:/app
    networks:
      - gateway-net
      - api-net
    expose:
      - 80
    command: uvicorn main:app --reload --host 0.0.0.0 --port 80
  
  astra_api_db:
    image: mongo:7.0
    container_name: astra_api_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_init:/docker-entrypoint-initdb.d:ro
    networks:
      - api-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  astra_ui:
    container_name: astra_ui
    build:
      context: ./astra_ui
      target: dev
    ports:
      - "4000:5173"
    volumes:
      - ./astra_ui:/app
      - /app/node_modules
    networks:
      - gateway-net
    expose:
      - 5173
  
  # Ephemerides API Service
  sideris:
    container_name: sideris
    build:
      context: ./sideris
      # target: dev
    restart: unless-stopped
    # ports:
    #   - "8624:8624"
    volumes:
      - ./sideris:/app
    networks:
      - gateway-net
    expose:
      - 8624

    command: uvicorn sideris:app --reload --host 0.0.0.0 --port 8624 --root-path /api/sideris


  kong_gateway:
    container_name: kong_gateway
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

    volumes:
      - ./gateway/config.yml:/kong/kong.yml:ro
      - ./gateway:/var/log/kong/logs
    
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - astra_api
    
    networks:
      - gateway-net
  
networks:
  gateway-net:
    driver: bridge
  api-net:
    driver: bridge
  

volumes:
  mongodb_data:
  mongodb_init: