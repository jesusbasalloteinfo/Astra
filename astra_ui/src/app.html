<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Load the style
			(function() {
				const saved = localStorage.getItem('theme');
				const valid = ['standard', 'dark', 'light', 'astronomical'];
				if (saved && valid.includes(saved)) {
					document.documentElement.setAttribute('data-theme', saved);
				}
			})();
		</script>

		<title>ASTRA</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="description" content="Automated Smart Telescope Remote Assistant - Unified Astronomy Platform" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="ASTRA Astronomy" />
		<meta property="og:description" content="Control your telescope with AI, explore the 3D night sky, and automate your observation sessions." />
		<meta property="og:image" content="/favicon.svg" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ASTRA Astronomy" />
		<meta name="twitter:description" content="Control your telescope with AI, explore the 3D night sky, and automate your observation sessions." />
		<meta name="twitter:image" content="/favicon.svg" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
